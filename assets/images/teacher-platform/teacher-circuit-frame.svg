<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">STEM circuit frame</title>
  <desc id="desc">A quiet circuit-board perimeter with small bridge, cube, compass, and paper-airplane symbols.</desc>
  <defs>
    <style>
      .gold{stroke:#b58a48}.green{stroke:#729b83}.trace{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.soft{opacity:.5}.node{stroke:none}.pad{fill:#27313d;stroke-width:2}
    </style>
  </defs>

  <!-- Short perimeter circuits leave the central workspace completely quiet. -->
  <g class="trace gold" opacity=".72">
    <path d="M0 44h54v28h34v34h42"/>
    <path d="M0 176h38v-30h64"/>
    <path d="M0 254h74v38h42v54h48"/>
    <path d="M0 770h42v-38h52v-42h44"/>
    <path d="M0 842h84v-32h54"/>
    <path d="M1600 44h-54v28h-34v34h-42"/>
    <path d="M1600 176h-38v-30h-64"/>
    <path d="M1600 254h-74v38h-42v54h-48"/>
    <path d="M1600 770h-42v-38h-52v-42h-44"/>
    <path d="M1600 842h-84v-32h-54"/>
  </g>
  <g class="trace green" opacity=".68">
    <path d="M0 112h28v34h42"/>
    <path d="M0 394h54v34h38v48h48"/>
    <path d="M0 566h38v-34h60v-42h40"/>
    <path d="M0 716h70v-42h66"/>
    <path d="M1600 112h-28v34h-42"/>
    <path d="M1600 394h-54v34h-38v48h-48"/>
    <path d="M1600 566h-38v-34h-60v-42h-40"/>
    <path d="M1600 716h-70v-42h-66"/>
  </g>

  <!-- Junctions and terminal pads make the frame read as circuitry. -->
  <g class="gold node" fill="#b58a48" opacity=".82">
    <circle cx="54" cy="44" r="5"/><circle cx="102" cy="146" r="5"/><circle cx="74" cy="292" r="5"/>
    <circle cx="94" cy="732" r="5"/><circle cx="138" cy="810" r="5"/>
    <circle cx="1546" cy="44" r="5"/><circle cx="1498" cy="146" r="5"/><circle cx="1526" cy="292" r="5"/>
    <circle cx="1506" cy="732" r="5"/><circle cx="1462" cy="810" r="5"/>
  </g>
  <g class="green node" fill="#729b83" opacity=".82">
    <circle cx="28" cy="112" r="5"/><circle cx="92" cy="428" r="5"/><circle cx="98" cy="532" r="5"/><circle cx="70" cy="674" r="5"/>
    <circle cx="1572" cy="112" r="5"/><circle cx="1508" cy="428" r="5"/><circle cx="1502" cy="532" r="5"/><circle cx="1530" cy="674" r="5"/>
  </g>
  <g class="pad" opacity=".7">
    <rect class="gold" x="154" y="337" width="18" height="18" rx="3"/><rect class="green" x="130" y="467" width="18" height="18" rx="3"/>
    <rect class="gold" x="1428" y="337" width="18" height="18" rx="3"/><rect class="green" x="1452" y="467" width="18" height="18" rx="3"/>
  </g>

  <!-- Bridge, integrated into the upper-left circuit. -->
  <g class="trace gold" opacity=".82">
    <path d="M42 206h100M50 206v14m84-14v14M50 206q10-42 42-42t42 42M66 206v-25m17 25v-38m18 38v-38m17 38v-25"/>
    <path d="M142 206h28v-28h24"/>
  </g>

  <!-- Cube, integrated into the lower-left circuit. -->
  <g class="trace green" opacity=".82">
    <path d="M54 604l36-20 36 20v42l-36 21-36-21v-42zm0 0 36 21 36-21M90 625v42"/>
    <path d="M126 646h34v-24h28"/>
  </g>

  <!-- Compass, integrated into the upper-right circuit. -->
  <g class="trace green" opacity=".82">
    <circle cx="1510" cy="202" r="39"/>
    <path d="M1510 168v8m0 52v8m-34-34h8m52 0h8m-48 17 12-28 18-8-9 18-21 18z"/>
    <path d="M1471 202h-30v-28h-28"/>
  </g>

  <!-- Paper airplane, integrated into the lower-right circuit. -->
  <g class="trace gold" opacity=".82">
    <path d="M1469 621l78-28-30 62-17-23-31-11zm31 11 47-39-30 62"/>
    <path d="M1469 621h-34v-26h-28"/>
  </g>

  <!-- A few restrained chip-like branches complete the circuit language. -->
  <g class="trace soft">
    <g class="gold">
      <path d="M24 322h22v18h18m-40 290h22v-18h18M1576 322h-22v18h-18m40 290h-22v-18h-18"/>
      <path d="M118 96h34v18h32M1482 96h-34v18h-32"/>
    </g>
    <g class="green">
      <path d="M24 510h24v18h24M1576 510h-24v18h-24"/>
      <path d="M112 758h40v18h30M1488 758h-40v18h-30"/>
    </g>
  </g>
</svg>
